<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Staatus Bear AR</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <!-- Fallback component for iOS / non-XR browsers -->
  <script type="module"
          src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    #mv-wrapper{display:none;height:100%}
    model-viewer{width:100%;height:100%}
    .ar-button{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
               padding:12px 24px;font:18px sans-serif;border-radius:8px;
               background:#1976d2;color:#fff;border:none}
    .ar-link{position:fixed;top:12px;padding:6px 12px;font:14px sans-serif;
             background:rgba(25,118,210,0.8);color:#fff;border-radius:4px;
             text-decoration:none}
  </style>
  <!-- Google Tag Manager or Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9WTBQ8BBK2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-9WTBQ8BBK2');
</script>

</head>

<body>
<div id="mv-wrapper">
  <model-viewer id="mv"
                src="1968_Volkswagen_Beetle.glb"
                ios-src="1968_Volkswagen_Beetle.usdz"
                ar ar-modes="scene-viewer quick-look webxr" ar-scale="fixed"
                autoplay camera-controls="false" disable-tap
                style="background:transparent;">
    <button slot="ar-button" class="ar-button">View in AR</button>
  </model-viewer>
</div>

<a href="https://openai.com" target="_blank" class="ar-link" style="left:12px;">OpenAI</a>
<a href="https://google.com" target="_blank" class="ar-link" style="left:90px;">Google</a>

<script type="module">
  // Need an async block to use await inside a <script type="module">
  (async () => {

    if (navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')) {

      const [{ PerspectiveCamera, Scene, WebGLRenderer, Color },
             { ARButton }] = await Promise.all([
               import('https://unpkg.com/three@0.165.0/build/three.module.js'),
               import('https://unpkg.com/three@0.165.0/examples/jsm/webxr/ARButton.js')
             ]);
      const { GLTFLoader } = await import('https://unpkg.com/three@0.165.0/examples/jsm/loaders/GLTFLoader.js');

      document.getElementById('mv-wrapper').style.display = 'none';

      const scene    = new Scene();
      scene.background = new Color(0x000000);

      const camera   = new PerspectiveCamera();
      const renderer = new WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      document.body.appendChild(
        ARButton.createButton(renderer, { requiredFeatures: [] })
      );

      const loader = new GLTFLoader();
      loader.load('1968_Volkswagen_Beetle.glb', gltf => {

        const car = gltf.scene;
        car.rotation.y = Math.PI;          // face user
        car.scale.set(1, 1, 1);            // maximum size

        renderer.xr.addEventListener('sessionstart', () => {
          const cam = renderer.xr.getCamera(camera);
          car.position.set(0, -0.3, -1.2); // 1.2 m straight ahead
          cam.add(car);                    // instant placement
        });

        renderer.setAnimationLoop(() => renderer.render(scene, camera));
      });

    } else {
      document.getElementById('mv-wrapper').style.display = 'block';
    }

  })();
</script>
<p class="file-info">This static HTML page loads a 1968 Volkswagen Beetle model for augmented reality using either Three.js or Google's <code>model-viewer</code>. This paragraph is for testing purposes.</p>
</body>
<!--
  This index.html file is the main entry point for the Staatus Bear AR demo.
  It loads a 3D model and displays it in AR using Three.js WebXR when
  supported, or <model-viewer> as a fallback. This comment was added as a test.
-->
</html>
